# Quarto book project: `quarto render` builds the website (HTML), the
# PDF (Typst) and the ePUB into ../release/latest/site.
project:
  type: book
  output-dir: ../release/latest/site
  resources:
    - resource/image/**

book:
  title: Assembly from the Ground Up
  subtitle: >-
    An updated x86 Linux edition of *Programming from the Ground Up*
    by Jonathan Bartlett
  author:
    - Jonathan Bartlett
    - Israel Roldan
  publisher: Israel Roldan
  date: today
  date-format: iso
  output-file: ProgrammingGroundUp
  repo-url: https://github.com/airvzxf/assembly-from-the-ground-up
  repo-subdir: src
  repo-actions: [source, issue]
  downloads: [pdf, epub]
  search: true
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-computer-architecture.qmd
    - 03-your-first-programs.qmd
    - 04-all-about-functions.qmd
    - 05-dealing-with-files.qmd
    - 06-reading-and-writing-simple-records.qmd
    - 07-developing-robust-programs.qmd
    - 08-sharing-functions-with-code-libraries.qmd
    - 09-intermediate-memory-topics.qmd
    - 10-counting-like-a-computer.qmd
    - 11-high-level-languages.qmd
    - 12-optimization.qmd
    - 13-moving-on-from-here.qmd
  appendices:
    - appendix-a-gui-programming.qmd
    - appendix-b-common-x86-instructions.qmd
    - appendix-c-important-system-calls.qmd
    - appendix-d-table-of-ascii-codes.qmd
    - appendix-e-c-idioms-in-assembly-language.qmd
    - appendix-f-using-the-gdb-debugger.qmd
    - appendix-g-document-history.qmd
    - appendix-h-gnu-free-documentation-license.qmd
    - appendix-i-personal-dedication.qmd
    - appendix-j-updated-by-airvzxf.qmd
    - appendix-k-solutions-to-the-review-questions.qmd

lang: en-US
rights: >-
  © 2003 Jonathan Bartlett. Modifications © 2020–2026 Israel Roldan.
  Licensed under the GNU Free Documentation License, Version 1.1 or any
  later version.
# Quarto numbers the chapters (1, 2, ...) and appendices (A, B, ...);
# the sections inside them are not numbered.
number-sections: true
number-depth: 1
toc-depth: 2

filters:
  - resource/pandoc/lua/include-code-files.lua

highlight-style: resource/pandoc/theme/default.theme
syntax-definitions:
  - resource/pandoc/syntax/gnuassembler.xml
  - resource/pandoc/syntax/c.xml
  - resource/pandoc/syntax/bash.xml

format:
  html:
    theme:
      light: [cosmo, resource/quarto/theme.scss]
      dark: [darkly, resource/quarto/theme.scss]
    code-copy: true
  typst:
    papersize: us-letter
    margin:
      x: 1in
      y: 1in
    mainfont: Libertinus Serif
    codefont: DejaVu Sans Mono
    fontsize: 11pt
  epub:
    css: resource/pandoc/css/style.css
    identifier: urn:uuid:7ee56819-71ac-415a-a058-0b83d99113d3
