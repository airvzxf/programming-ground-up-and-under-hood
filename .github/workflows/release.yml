name: CI - Build, Deploy and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04 # Pin version to match Dockerfile
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (Pandoc, Typst, gcc-multilib)
        run: sudo bash scripts/install-deps.bash

      - name: Build books
        run: bash src/make.bash

      - name: Build and test the assembly examples
        run: |
          bash src/resource/asm/make.bash
          bash src/resource/asm/test.bash

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: books
          path: release/latest/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write # Cloudflare Pages deployment status
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: books
          path: release/latest/

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy release/latest/site
            --project-name=programming-ground-up
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Upload assets to the GitHub release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: books
          path: release/latest/

      - name: Upload to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/latest/ProgrammingGroundUp.pdf
            release/latest/ProgrammingGroundUp.epub
            release/latest/ProgrammingGroundUp.html
            release/latest/ProgrammingGroundUp.md
            release/latest/resource.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
